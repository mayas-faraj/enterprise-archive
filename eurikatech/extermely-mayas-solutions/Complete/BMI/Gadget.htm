<html>
<head>
    <title>BMI measurment</title>
    <meta name="description" content="Measure BMI (Body Mass Index) and IBW (Ideal Body Weight)">
    <meta name="author" content="Mayas Faraj">
    <meta name="contact" content="bestuniqueguy@yahoo.com">
    <meta name="keywords" content="BMI,IBW,body,mass,index,ideal,body,weight">

    <script type="text/javascript">
		var pos=0;
		var toRight=true;
    	
    	function initial()
    	{
    		document.body.style.Width=135;
    		document.body.style.Height=135;
    		
    		moveBall();
    	}
    	
    	function moveBall()
    	{
    		if((parseInt(document.images.item("imgBall").style.left)<parseInt(document.body.clientWidth-document.images.item("imgBall").width))&&toRight)
    			document.images.item("imgBall").style.left=++pos;
       		else
    		{
				toRight=false;
    			if(parseInt(document.images.item("imgBall").style.left)>=0)
    				document.images.item("imgBall").style.left=--pos;
    			else
    				toRight=true;

    		}
    		setTimeout("moveBall()",10);
    	}
    
    	function chkInput(control,evnt)
    	{
			if(evnt.keyCode==46&&control.value.indexOf(".")==-1)
			{
				if(control.value=="")
					control.value="0";
					
				return true;
			}
			else
				if(evnt.keyCode>=48&&evnt.keyCode<=57)
				{
					if(control.value=="0")
						control.value="";
					return true;
				}

			
			if(control.value=="")
				control.value="0";
			return false;
    	}
    	
    	function chkBlur(control)
    	{
    		if(control.value.indexOf(".")==control.value.length-1)
    			control.value+="0";
    	}
    	
        function clrForms()
        {
        	document.getElementById("txHeight").value="0";
        	document.getElementById("txWeight").value="0";
        }
                
        function mathBMI()
        {
        	var weight;
        	var height;
        	
        	if(document.getElementById("txHeight").value==0)
        	{
        		alert("the height must above zero");
        		return -1;
        	}
        	else
        	{
        		if(document.getElementById("weightUnit").selectedIndex==1)
        			weight=parseFloat(document.getElementById("txWeight").value *0.45359237);
        		else
        			weight=parseFloat(document.getElementById("txWeight").value);
        		
        		if(document.getElementById("heightUnit").selectedIndex==1)
          			height=parseFloat(document.getElementById("txHeight").value*.3048);
        		else if(document.getElementById("heightUnit").selectedIndex==2)
        			height=parseFloat(document.getElementById("txHeight").value*.0254);
        		else
        			height=parseFloat(document.getElementById("txHeight").value/100);
        		
        	
        		return weight/(height*height);
        	}
           }
           
           function mathGrad(grad)
           {
           		grad=parseFloat(grad);
           		
           		if(grad>40)
           			return "Very Fat";
           		else if(grad>30)
           			return "Fat";
           		else if(grad>25)
           			return "Over Optimal";
           		else if(grad>18.5)
           			return "Optimal";
           		else if(grad>17.5)
           			return "Under Optimal";
           		else
           			return "Slim";
           }
           
           function mathIBW()
           {
           		var ibw;
           		var weight;
           		var height;
           		          		
           		if(document.getElementById("weightUnit").selectedIndex==1)
        			weight=parseFloat(document.getElementById("txWeight").value *0.45359237);
        		else
        			weight=parseFloat(document.getElementById("txWeight").value);
        			
        		
				if(document.getElementById("heightUnit").selectedIndex==2)
          			height=parseFloat(document.getElementById("txHeight").value);
        		else if(document.getElementById("heightUnit").selectedIndex==0)
        			height=parseFloat(document.getElementById("txHeight").value*0.39370079);
        		else
        			height=parseFloat(document.getElementById("txHeight").value*12);
        			
        		if(height>60)
        			ibw=((height-60)*2.3)+50;
        		else
        			ibw=50;
        		
        		if(document.getElementById("gender_female").checked)
        			ibw-=4.5;
        		
        		return ibw;
           }
           
           function writeResult()
           {
           		var bmi=mathBMI();
           		var ibw=mathIBW();
           		var grad=mathGrad(bmi);

			if(bmi==-1)
				return;
           		
           		document.write("<html><head><link rel=\"stylesheet\" type=\"text/css\" href=\"files/style.css\"/></head>");
           		document.write("<body background=\"imgs/result.png\" style=\"background-image:url('imgs/result.png');background-repeat:no-repeat;width:135px;height:135px;margin:0 0 0 0;padding:0 0 0 0\">");
           		document.write("<br><table width=\"135px\" border=\"0\" class=\"text\" cellpadding=\"3\">");
           		document.write("<tr><td>IBW : "+parseInt(ibw+1)+" KG</td><td rowspan=2 valign=\"middle\">"+grad+"</td></tr>");
           		document.write("<tr><td>BMI :"+parseInt(bmi)+"<br/>(see the line)</td></tr></table>");
           		document.write("<center><input class=\"button\" type=\"button\" id=\"cmdBack\" value=\"Back\" onclick=\"window.location=\'Gadget.htm\'\"/></center>");
				document.write("</body></html>");
           }
    </script>
    <link rel="stylesheet" type="text/css" href="files/style.css"/>
    </head>
<body background="imgs/background.png" style="background-image:url('imgs/background.png');background-repeat:no-repeat;margin:0 0 0 0;width:135px;height:135px;padding:0 0 0 0" onload="moveBall();">
<br class="text"/>
<img alt="ball" name="imgBall" id="imgBall" src="imgs\ball.png" style="position:absolute;left:0px;top:18px; width:20px;height:20px"/><br class="text"/><br class="text"/>
<table cellpadding="0" cellspacing="0" width="100%" border="0" class="text">
<tr>
<td>Gender</td>
<td><input type="radio" id="gender_male" name="gender" value="male" checked="checked" />Male</td>
<td><input type="radio" id="gender_female" name="gender" value="female" />Female</td>
</tr>
<tr>
<td>Height</td>
<td><input class="control" type="text" id="txHeight" size="4" value="0" onkeypress="return chkInput(txHeight,event);" onblur="chkBlur(txHeight);" /></td>
<td><select class="control" id="heightUnit" style="width: 40px;"><option selected="selected">Cm</option><option>Feet</option><option>Inch</option></select></td>
</tr>
<tr>
<td>Weight</td>
<td><input class="control" type="text" id="txWeight" size="4" value="0" onkeypress="return chkInput(txWeight,event);" onblur="chkBlur(txWeight);" /></td>
<td><select class="control" id="weightUnit" style="width: 40px"><option selected="selected">Kg</option><option>Bound</option></select></td>
</tr>
<tr height="24px">
<td colspan="2" align="center"><br/><input class="button" type="button" name="cmdRun" value="Calculate" onclick="writeResult();" /></td>
<td align="center"><br/><input class="button" type="button" name="cmdClear" value="Clear" onclick="clrForms();" /></td>
</tr>
</table>
</body>
</html>
