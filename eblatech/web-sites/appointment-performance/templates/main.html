<h1 class="text-center">Appointment Performance</h1>
<div class="container">
	<div class="row mt-4">
		<div class="col-sm">
			Start Date: <input id="startDatepicker" class="datepicker">
		</div>
		<div class="col-sm">
			End Date: <input id="endDatepicker" class="datepicker">
		</div>
		<div class="col-sm">
			<button type="button" id="runButton" class="btn btn-primary">Update Result</button>
		</div>
	</div>
	<div class="row mt-4">
		<div class="col-4">
		[table]
		</div>
		<div class="col-5">
			<canvas id="pieChart"></canvas>
		</div>
		<div class="col-3">
			<table class="table table-striped" id="staffTable">
				<thead>
					<tr>
						<th scope="col">Staff</th>
						<th scope="col">ID</th>
					</tr>
				</thead>
				<tbody>
					<tr>
						<td scope="row"></th>
						<td scope="row"></th>
					</tr>
				</tbody>
			</table>
			<button type="button" id="staffButton" class="btn btn-primary" data-toggle="modal" data-target="#staffModal">Edit Staff ID</button>
		</div>
	</div>
</div>


<!-- Modal -->
<div class="modal fade" id="staffModal" tabindex="-1" role="dialog" aria-labelledby="staffLabel" aria-hidden="true">
	<div class="modal-dialog modal-dialog-centered" role="document">
		<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title" id="staffLabel">Setting Staff ID</h5>
				<button type="button" class="close" data-dismiss="modal" aria-label="Close">
					<span aria-hidden="true">&times;</span>
				</button>
			</div>
			<div class="modal-body">
				<div class="container">
				</div>
			</div>
			<div class="modal-footer">
				<button id="saveStaffButton" type="button" class="btn btn-primary" data-dismiss="modal">Save</button>
				<button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
			</div>
		</div>
	</div>
</div>
<!--End Modal-->
