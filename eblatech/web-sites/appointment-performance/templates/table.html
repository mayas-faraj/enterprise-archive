<div class="row">
	<div class="col-sm" id="statisticsDiv">
		<h4><center>[title]</center></h4>
		<table class="table table-striped" id="[name]">
			<thead>
				<tr>
					<th scope="col">Approved</th>
					<th scope="col">Pending</th>
					<th scope="col">Rejected</th>
				</tr>
			</thead>
			<tbody>
				<tr>
					<td scope="row" id="approvedCell">[approved]</th>
					<td scope="row" id="pendingCell">[pending]</th>
					<td scope="row" id="rejectedCell">[rejected]</th>
				</tr>
			</tbody>
		</table>
	</div>
</div>
