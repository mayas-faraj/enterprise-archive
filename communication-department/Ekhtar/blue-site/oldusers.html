<html>
    <head>
        <title> Syria </title> 
        <meta charset="utf-8" >
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link    href="css/leaflet.css"   rel="stylesheet"/>
        <link    href="css/materialize.min.css"   rel="stylesheet"/>
        <link    href="css/p3.css"   rel="stylesheet"/>

        <script        src="js/jquery-3.1.1.min.js"></script> 
        <script        src="js/materialize.min.js"></script>  
        <script        src="js/leaflet.js"></script>        
        <script        src="js/p3.js"></script> 

        <link    href="css/dialog.css"   rel="stylesheet"/>
        <link href="http://ajax.googleapis.com/ajax/libs/jqueryui/1.9.2/themes/ui-darkness/jquery-ui.css" rel="stylesheet">
        <script src="http://ajax.googleapis.com/ajax/libs/jquery/1.10.2/jquery.min.js"></script>
        <script src="http://ajax.googleapis.com/ajax/libs/jqueryui/1.9.2/jquery-ui.min.js"></script>
    </head>

    <body onload="loadpics()">
        <div id="map"  style="width:100% ; height:100%;color:  activecaption"></div>      

        <div class="fixed-action-btn vertical">
            <a class="btn-floating btn-large activecaption">
                <i class="large material-icons">mode_edit</i>
            </a>
            <ul>
                <li><a class="btn-floating red"><i class="material-icons">map</i></a></li>
                <li><a class="btn-floating yellow darken-1"><i class="material-icons">format_quote</i></a></li>
                <li><a class="btn-floating blue" onclick="addbookmark()"><i class="material-icons">room</i></a></li>
                <li><a class="btn-floating green"><i class="material-icons">publish</i></a></li>

            </ul>
        </div>

        <div id="dialog" title="Bookmark">

            <label>latitude:</label>
            <input id="latitude" name="latitude" type="text">
            <label>longitude:</label>
            <input id="longitude" name="longitude" type="text">
            <label>message:</label>
            <input id="message" name="message" type="text">
            <input id="ok" type="button" value="ok"  onclick="insertbm()">

        </div>
    </body>
</html>
