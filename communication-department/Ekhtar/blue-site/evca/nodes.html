<!DOCTYPE html>
<html dir='rtl'>
	<head>
		<meta charset="utf-8">
		<meta name="description" content="Nodes Manager" />
		<meta name="author" content="CD" />
		<title>تعديل جهة إخطار</title>
		<link rel="stylesheet" href="css/basic.css">
		<link rel="stylesheet" href="css/style.css">
		<script src="scripts/jquery/jquery-3.1.1.min.js"></script>
		<script src="scripts/strophe/strophe.min.js"></script>
                <script src="scripts/strophe/strophe.pubsub.js" type="text/javascript"></script>
		<script src="scripts/interfaceAccess.js"></script>
                <script src="scripts/stropheAccess.js"></script>
		<script src="scripts/dataAccess.js"></script>
		<script src="scripts/sessionAccess.js"></script>
		<script src="scripts/imageCover.js"></script>
		<script src="scripts/master.js"></script>
		<script src="scripts/formValidation.js"></script>
		<script src="scripts/imageUpload.js"></script>
		<script src="js/nodes.js"></script>
	</head>
	<body id="body" class="background-full">
		<div class="input-main box-glass">	
			<div id="editNodeDiv" class="input-box">
				<input id="idText" type="hidden"/>
				<input id="nameText" type="text" placeholder="اسم جهة إخطار" readonly/>
				<input id="titleText" type="text" placeholder="الإسم الكامل للجهة"/>
				<input id="descriptionText" type="text" placeholder="الوصف"/>
			</div>
			<div id="imagNodeDiv" class="input-box">
				<img id="image" src="imgs/add_node.png" class="input-image"/>
				<label for="imageButton" class="input-upload">تحميل</label>
				<input id="imageButton" class="input-file" type="file" accept="image/*"/>
			</div>
			<div class="input-box input-button-box">
				<button on class="input-button" id="editButton">حفظ التعديلات</button>
			</div> 
			<div class="input-box input-button-box">
				<button on class="input-button" id="deleteButton">حذف جهة إخطار</button>
			</div>
		<label id="resultLabel" class="input-result"></label>
		</div>
		<div id="nodesDiv" class="input-icons-medium box-glass">
			<div id="icon" class="input-icon">
				<img id="iconImage" src="imgs/ekhtar.png" class="input-icon-image"/>
				<img src="imgs/add_node.png" class="input-icon-logo"/>
				<label class="input-icon-text">عنوان</label>
				<input type="hidden" value="10"/>
				<input type="hidden" value="اسم جهة إخطار"/>
				<input type="hidden" value="وصف جهة إخطار"/>
			</div>
		</div>
	</body>
</html>
