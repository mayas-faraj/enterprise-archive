<html>
    <head>
        <title>خارطة الستخدمين</title> 
        <meta charset="utf-8" >
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <link   href="css/bootstrap-datetimepicker.min.css" rel="stylesheet" type="text/css" media="screen">
        <link   href="css/bootstrap-combined.min.css" rel="stylesheet">

        
        <link    href="css/jquery-ui.css" rel="stylesheet">
        <link    href="css/bootstrap.min.css" rel="stylesheet">
        <link    href="css/materialize.min.css"   rel="stylesheet"/>
        <link    href="css/leaflet.css"   rel="stylesheet"/>
        <link    href="css/p1.css"   rel="stylesheet"/>
       
        
        <link    href="css/BootSideMenu.css" rel="stylesheet">
        <link    href="css/leaflet-areaselect.css" rel="stylesheet"> 
	<link    href="css/style.css" rel="stylesheet"> 
	<link    href="css/basic.css" rel="stylesheet"> 
     
        
        <script        src="js/jquery.min.js"></script>
        <script        src="js/jquery-ui.min.js"></script>
        <script        src="js/bootstrap.min.js"></script>
        <script        src="js/materialize.min.js"></script> 
        <script        src="js/leaflet.js"></script>
         
              

          
        <script type="text/javascript"      src="js/bootstrap-datetimepicker.min.js"></script>
        <script type="text/javascript"      src="js/bootstrap-datetimepicker.pt-BR.js"></script>
        <script src="js/BootSideMenu.js.download"></script>       
        <script src="js/leaflet-areaselect.js"></script> 
	<script src="scripts/strophe/strophe.min.js"></script>
	<script src="scripts/stropheAccess.js"></script>
	<script src="scripts/sessionAccess.js"></script>

        <script src="js/mapUsers.js"></script> 
   
   <style>.bootstrap-datetimepicker-widget{z-index:5000;}</style>
   
    </head>

    <body onload="loadpics()" dir="rtl">
        <div id="map"  style="width:100% ; height:100%;color:  activecaption;background: #d8d7ab"  ></div>      

        <div class="fixed-action-btn vertical">
            <a class="btn-floating btn-large activecaption">
                <i class="large material-icons" style="background: #b4c05a">mode_edit</i>
            </a>
            <ul>
                <li><a class="btn-floating blue" onclick="getuserslist()"><i class="material-icons" >supervisor_account</i></a></li>            
                <li><a class="btn-floating red"><i class="material-icons" onclick="myareaselect()">tab_unselected</i></a></li>
                <li><a class="btn-floating"  style="background: gray"><i class="material-icons" onclick="unselect()">tab_selected</i></a></li>
               
                <li><a class="btn-floating yellow darken-1" onclick="sendmessage()" ><i class="material-icons">email</i></a></li>
                <li><a class="btn-floating green" onclick="showplaces()"><i class="material-icons">navigation</i></a></li>
            </ul>
        </div>

         <div id="messagedialog" title="Message">
            <label>Message Text:</label>
            <input id="message" name="message" type="text" style="background: white; direction: rtl;">
            <input id="ok" type="button" value="ok"  onclick="sendmessage()" class="btn btn-success">
        </div>

         <div id="places" title="places" style="background: white;font-size:30px;color:blueviolet;z-index:1000">       
            <div>
               <select id="selectlist1"  style="display:block;height: 60px;" >
               <option value="Damascus" >Damascus</option>
               <option value="Aleppo"  >Aleppo</option>
               <option value="Homs"  >Homs</option>
               <option value="Hama"  >Hama</option>
               <option value="lattakia"  >Lattakia</option>
               <option value="tartus"  >Tartus</option>
               <option value="Daraa"  >Daraa</option>
               <option value="Deir ez-Zor"  >Deir ez-Zor</option>
               <option value="Idlib"  >Idlib</option>
               <option value="Al-Hasakah"  >Al-Hasakah</option>
               <option value="Al Raqqa"  >Al Raqqa</option>
               <option value="Quneitra"  >Quneitra</option>
               <option value="As-Suwayda"  >As-Suwayda</option>
               </select>
            </div>
            <br/>
            <input id="ok" type="button" value="ok"  onclick="movetoplace()"/>
        </div>

        <div id="test" class="container sidebar sidebar-left" data-status="opened" style="left: 0px;background: #d2e640">

            <div class="row">
  <div class="col-xs-12 col-sm-12 col-md-12 col-lg1-12" data-side="left">
      <div id="content_messages">
      </div>
      
  </div>
</div>
</div>

    </body>
</html>
