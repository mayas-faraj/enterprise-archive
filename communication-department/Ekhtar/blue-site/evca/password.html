<!DOCTYPE html>
<html dir='rtl'>
	<head>
		<meta charset="utf-8">
		<meta name="description" content="CD Admin Panel" />
		<meta name="author" content="CD" />
		<title>تغيير كلمة المرور</title>
		<link rel="stylesheet" href="css/basic.css">
		<link rel="stylesheet" href="css/style.css">
		<script src="scripts/jquery/jquery-3.1.1.min.js"></script>
		<script src="scripts/strophe/strophe.min.js"></script>
		<script src="scripts/stropheAccess.js"></script>
		<script src="scripts/dataAccess.js"></script>
		<script src="scripts/interfaceAccess.js"></script>
		<script src="scripts/sessionAccess.js"></script>
		<script src="scripts/imageCover.js"></script>
		<script src="scripts/formValidation.js"></script>
		<script src="scripts/master.js"></script>
		<script src="js/password.js"></script>
	</head>
	<body id="body">
		<div id="banner"></div>
		<div class="input-main box-glass">	
			<div id="adminDiv" class="input-box">
				<input id="oldPasswordText" type="password"  placeholder="كلمة المرور القديمة"/>
				<input id="passwordText" type="password"   placeholder="كلمة المرور الجديدة"/>
				<input id="confirmPasswordText" type="password"   placeholder="تأكيد كلمة المرور الجديدة"/>
			</div>
			 <div id="imageAdminDiv" class="input-box">
                                <img id="image" src="imgs/admin.png" class="input-image"/>
                        </div>
			<div class="input-box input-button-box">
				<button id="changePasswordButton" class="input-button">تغيير كلمة المرور</button>
			</div> 
			<label id="resultLabel" class="input-result"/>
		</div>
		<img class="input-cover-full" src="imgs/node_graph.png"/>
		<div id="footer"></div>		
	</body>
</html>
