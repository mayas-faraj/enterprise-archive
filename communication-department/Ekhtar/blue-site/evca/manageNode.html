<!DOCTYPE html>
<html dir='rtl'>
	<head>
		<meta charset="utf-8">
		<meta name="description" content="CD Admin Panel" />
		<meta name="author" content="CD" />
		<title>إضافة جهة إخطار</title>
		<link rel="stylesheet" href="css/basic.css">
		<link rel="stylesheet" href="css/style.css">
		<script src="scripts/jquery/jquery-3.1.1.min.js"></script>
		<script src="scripts/strophe/strophe.min.js"></script>
                <script src="scripts/strophe/strophe.pubsub.js" type="text/javascript"></script>
                <script src="scripts/stropheAccess.js"></script>
		<script src="scripts/interfaceAccess.js"></script>
		<script src="scripts/dataAccess.js"></script>
		<script src="scripts/sessionAccess.js"></script>
		<script src="scripts/master.js"></script>
		<script src="scripts/imageCover.js"></script>
		<script src="scripts/formValidation.js"></script>
		<script src="scripts/imageUpload.js"></script>
		<script src="js/manageNode.js"></script>
	</head>
	<body id="body">
		<div class="input-main box-glass">	
			<div id="addNodeDiv" class="input-box">
				<div>
					<input type="text" class="input-jid-domain" tabindex="-1" value="@ekhtar.sy"/>
					<input id="nameText" class="input-jid" type="text" placeholder="الجهة "/>
					<input type="text" class="input-jid-es" tabindex="-1" value="es-"/>
				</div>
				<input id="titleText" type="text" placeholder="الإسم الكامل للجهة"/>
				<input id="fullNameText" type="text" placeholder="اسم مدير إخطار"/>
				<input id="passwordText" type="password" placeholder="كلمة المرور"/>
				<input id="confirmPasswordText" type="password" placeholder="تأكيد كلمة المرور"/>
			</div>
			<div id="imageNodeDiv" class="input-box">
				<img id="image" src="imgs/add_node.png" class="input-image"/>
				<label for="imageButton" class="input-upload">تحميل</label>
				<input id="imageButton" class="input-file" type="file" accept="image/*"/>
			</div>
			<div class="input-box input-button-box">
				<button class="input-button" id="addButton">
					إضافة جهة إخطار
				</button>
			</div>
		</div>
		<div class="input-icons-upper box-glass">
			<label id='resultLabel' class='input-result'></label>
			<img id="adminStatusImage" class="input-status-image visibility-hidden status-exclamation"/>
                        <label class="input-status-text visibility-hidden">إضافة مدير جهة أخطار (*).</label>
			<img id="nodeStatusImage" class="input-status-image visibility-hidden status-exclamation"/>
			<label class="input-status-text visibility-hidden">إضافة جهة إخطار (*).</label>
			<img id="databaseStatusImage" class="input-status-image visibility-hidden status-exclamation"/>
			<label class="input-status-text visibility-hidden">مزامنة التغيرات مع قاعدة البيانات.</label>
		</div>
		<img class="input-cover" src="imgs/user_graph.png"/>
	</body>
</html>
