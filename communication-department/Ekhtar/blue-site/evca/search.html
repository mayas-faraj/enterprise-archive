	input {width: auto; display: inline;margin: 0px !important; padding: 0px !important;}

    <body dir="rtl" onload="loadpics()" >
        <div id="map"  style="width:100% ; height:100%;color:  activecaption;background: #d8d7ab"  ></div>      

        <div class="fixed-action-btn vertical">
            <a class="btn-floating btn-large activecaption">
                <i class="large material-icons" style="background: springgreen">mode_edit</i>
            </a>
            <ul>

                <li><a class="btn-floating black darken-1" onclick="finddata()"><i class="material-icons">search</i></a></li>
                                <li><a class="btn-floating blue"><i class="material-icons" onclick="clearmarkers()">map</i></a></li>
                <li><a class="btn-floating yellow" onclick="addbookmark()"><i class="material-icons">room</i></a></li>
                <li><a class="btn-floating green" onclick="showplaces()"><i class="material-icons">navigation</i></a></li>
            </ul>
        </div>

        <div id="places" title="places" style="background: white;font-size:30px;color:blueviolet;z-index:1000">       
            <div>
               <select id="selectlist1"  style="background:yellow;display:block;height: 60px;" >
               <option value="Damascus" >Damascus</option>
               <option value="Aleppo"  >Aleppo</option>
               <option value="Homs"  >Homs</option>
               <option value="Hama"  >Hama</option>
               <option value="Lattakia"  >Lattakia</option>
               <option value="Tartus"  >Tartus</option>
               <option value="Daraa"  >Daraa</option>
               <option value="Deir ez-Zor"  >Deir ez-Zor</option>
               <option value="Idlib"  >Idlib</option>
               <option value="Al-Hasakah"  >Al-Hasakah</option>
               <option value="Al Raqqa"  >Al Raqqa</option>
               <option value="Quneitra"  >Quneitra</option>
               <option value="As-Suwayda"  >As-Suwayda</option>
               </select>
            </div>
            <br/>
            <input id="ok" type="button" value="ok"  onclick="movetoplace()"/>
        </div>
            
        
        <div id="bookmarkdialog" title="Bookmark">
            <label>latitude:</label>
            <input id="latitude" name="latitude" value="33.5138" type="text">
            <label>longitude:</label>
            <input id="longitude" name="longitude" value="36.2765" type="text">
            <label>message:</label>
            <input id="message" name="message" type="text">
            <input id="ok" type="button" value="ok"  onclick="insertbm2()" class="btn btn-success">
        </div>
        
        <div id="searchdialog" title="Dialog Form" style="margin-top: 50px" >
            <form role="form"  id="form1" >
                <fieldset style='padding: 3px'>
                    <legend id="title" >Search</legend>
                    
              <input type="hidden" name="l1"  />
              <input type="hidden" name="l2" value="your-field-value" />
              <input type="hidden" name="l3" value="your-field-value" />
              <input type="hidden" name="l4" value="your-field-value" />
                   <label>كلمات مفتاحية</label>
                    <div id="key_word_div" >
                        <input type="text" name="key_word" placeholder="كلمات للبحث"  style="background: white" />
                    </div>
	           <label>المستخدم المرسل</label>
                    <div id="user_div" >
                        <input type="text" name="user" placeholder="9xxxxxxxx"  style="background: white" />
                    </div>        
                  <label>بدأً من تاريخ</label>
                     <div id="datetimepicker1" class="input-append date" style="width:90%;">
                         <input type="text" name="starttime" style="font-size: 20px;display: inline;width: 95%;background: white"/>
                      <span style="height:100%;border-radius: 0;margin: 5px;" class="add-on">
                           <i   data-time-icon="icon-time" data-date-icon="icon-calendar" style="background: url(imgs/clock.png);background-size: cover;"></i>
                      </span>
                   </div>
                  
                    <label>أنتهاء بتاريخ</label>
                    <div id="datetimepicker2" class="input-append date" style="width:90%;">
                        <input data-format="dd-MM-yyyy hh:mm:ss" type="text" name="endtime" style="font-size: 20px;width: 95%; display: inline;background: white"/>
                      <span style="height:100%;border-radius: 0;margin: 5px;" class="add-on">
                           <i  data-time-icon="icon-time" data-date-icon="icon-calendar" style="background: url(imgs/clock.png);background-size: cover;"></i>
                      </span>
                   </div>
                    
                    <div id="date_div" class="form-group">
                        <input type="button" value="Send" onclick="ajaxp1_click()" class="btn btn-success">
                    </div>
                </fieldset>
            </form>
        </div>
 <div id="test1" class="container sidebar sidebar-left" data-status="opened" style="left: 0px;background: #d2e640">

            <div class="row" style="background: #6383d3 ">
  <div id='scroller' class="col-xs-12 col-sm-12 col-md-12 col-lg1-12" data-side="left">
      <div id="content_messages">
      </div>
      
  </div>
</div>
</div>
