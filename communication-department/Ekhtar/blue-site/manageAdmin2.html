<!DOCTYPE html>
<html dir='rtl'>
	<head>
		<meta charset="utf-8">
		<meta name="description" content="CD Admin Panel" />
		<meta name="author" content="CD" />
		<title>إضافة مستخدم مقر رئيسي</title>
		<link rel="stylesheet" href="css/basic.css">
		<link rel="stylesheet" href="css/style.css">
		<script src="scripts/jquery/jquery-3.1.1.min.js"></script>
		<script src="scripts/strophe/strophe.min.js"></script>
		<script src="scripts/interfaceAccess.js"></script>
		<script src="scripts/stropheAccess.js"></script>
		<script src="scripts/dataAccess.js"></script>
		<script src="scripts/sessionAccess.js"></script>
		<script src="scripts/imageCover.js"></script>
		<script src="scripts/formValidation.js"></script>
		<script src="scripts/imageUpload.js"></script>
		<script src="scripts/master.js"></script>
		<script src="js/manageAdmin2.js"></script>
	</head>
	<body id="body">
		<div id="banner"></div>
		<div class="input-main box-glass">	
			<div id="addAdminDiv" class="input-box">
				<div>
					<input type="text" class="input-jid-domain" tabindex="-1" value="@ekhtar.sy"/>
					<input id="nameText" type="text" class="input-jid"  placeholder="معرف المستخدم"/>
				</div>
				<input id="fullNameText" type="text"   placeholder="الاسم الكامل"/>
				<input id="descriptionText" type="text"   placeholder="الوصف"/>
				<input id="passwordText" type="password"   placeholder="كلمة المرور"/>
				<input id="confirmPasswordText" type="password"   placeholder="تأكيد كلمة المرور"/>
			</div>
			 <div id="imageAdminDiv" class="input-box">
                                <img id="image" src="imgs/admin.png" class="input-image"/>
                                <label for="imageButton" class="input-upload">تحميل</label>
                                <input id="imageButton" class="input-file" type="file" accept="image/*"/>
                        </div>
			<div id="adminOptionDiv" class="input-button-box">
				<div class="input-icon">
					<img id="roleImage" class="input-icon-image-selected"/>
					<label id="roleText" class="input-icon-text"></label>
					<input id="roleId" type="hidden"/>
				</div>
			</div>

			<button id="addButton" class="input-inline">إضافة مستخدم مقر رئيسي</button>
			<label id="resultLabel" class="input-result"/>
		</div>
		<div id="rolesDiv" class="input-icons-upper box-glass">
			<div id="administrator" class="input-icon">
				<img id="iconImage" src="imgs/role_administrator.png" class="input-icon-image-large"/>
				<label class="input-icon-text-large">مدير النظام</label>
				<input type="hidden" value="1"/>
			</div>
			<div id="administratorInfo" class="input-info visibility-none">
				يملك المدير الصلاحيات التالية:
				<ul>
					<li>إضافة جهة أخطار</li>
					<li>إضافة مدير</li>
					<li>إضافة مستخدم لأي جهة</li>
					<li>إرسال أمر للمستخدمين</li>
					<li>تعيين تقرير كمعالج</li>
					<li>التعليق على تقرير</li>
					<li>تعيين تقرير كمهم</li>
				</ul>
			</div>
			<div id="observer" class="input-icon">
				<img id="iconImage" src="imgs/role_observer.png" class="input-icon-image-large"/>
				<label class="input-icon-text-large">مراقب بيانات</label>
				<input type="hidden" value="2"/>
			</div>
			<div id="observerInfo" class="input-info visibility-none">
				يمكل مراقب البيانات الصلاحيات التالية:
				<ul>
					<li>تعيين التقرير كمعالج</li>
					<li>التعليق على تقرير</li>
					<li>تعيين تقرير كمهم</li>
				</ul>
			</div>
		</div>
		<img class="input-cover" src="imgs/user_graph.png"/>
		<div id="footer"></div>		
	</body>
</html>
