<!DOCTYPE html>
<html dir='rtl'>
	<head>
		<meta charset="utf-8">
		<meta name="description" content="CD Admin Panel" />
		<meta name="author" content="CD" />
		<title>تسجيل الدخول</title>
		<link rel="stylesheet" href="css/fonts.css">
                <link rel="stylesheet" href="css/theme.css">
                <link rel="stylesheet" href="css/materialize.new.min.css">
                <link rel="stylesheet" href="css/materialize-rtl.css">
                <link rel="stylesheet" href="css/materialize-child.min.css">
                <link rel="stylesheet" href="css/material-icons.css">
		<link rel="stylesheet" href="css/rotating.css">
                <script src="scripts/jquery/jquery-3.3.1.min.js"></script>
                <script src="scripts/strophe/strophe.min.js"></script>
                <script src="scripts/stropheAccess.js?v19.0"></script>
                <script src="scripts/dataAccess.js?v19.0"></script>
                <script src="scripts/sessionAccess.js?v19.0"></script>
                <script src="scripts/materialize.new.min.js"></script>
                <script src="scripts/formValidation.js"></script>
                <script src="scripts/setManager.js?v19.0"></script>
		<script src="scripts/setImporter.js"></script>
		<script src="js/old/login.js"></script>
	</head>
	<body>
		<div class="login-image">
			<img src="imgs/ekhtar.png">
		</div>
		<div class="container">
			<div class="row">
				<div class="col s12 l4 offset-l4">
					<div class="login-box content-block">
						<div class="content-header center">
							<i class="material-icons">lock</i>
						</div>
						<div>
							<div class="input-field">
								<i class="material-icons prefix">face</i>
								<input id="nameText" type="text" class="validate">
								<label for="nameText">اسم الجهة</label>
							</div>
							<div class="input-field">
								<i class="material-icons prefix">vpn_key</i>
								<input id="passwordText" type="password" class="validate">
								<label for="passwordText">كلمة المرور</label>
							</div>
							<label id='result'>&nbsp; </label>
							<button id="loginButton" class="btn waves-effect waves-light" style="width: 100%">تسجيل الدخول</button>

							<div id="loginDiv">
								<i class="material-icons">assignment_ind</i>
								<label>تسجيل الدخول</label>
							</div>
							<div id="accessDiv">
								<i class="material-icons">storage</i>
								<label>الوصول للمخدم</label>
							</div>
							<div id="settingsDiv">
								<i class="material-icons">settings</i>
								<label>تحميل الاعدادات</label>
							</div>
						</div>
					</div>	
				</div>
			</div>
		</div>
	</body>
</html>
