<!DOCTYPE html>
<html dir='rtl'>
	<head>
		<meta charset="utf-8">
		<meta name="description" content="CD Admin Panel" />
		<meta name="author" content="CD" />
		<title>تغيير كلمة المرور</title>
                <link rel="stylesheet" href="css/fonts.css">
                <link rel="stylesheet" href="css/theme.css">
                <link rel="stylesheet" href="css/materialize.new.min.css">
                <link rel="stylesheet" href="css/materialize-rtl.css">
                <link rel="stylesheet" href="css/materialize-child.min.css">
                <link rel="stylesheet" href="css/material-icons.css">
                <link rel="stylesheet" href="css/rotating.css">

                <script src="scripts/jquery/jquery-3.1.1.min.js"></script>
                <script src="scripts/materialize.new.min.js"></script>
                <script src="scripts/strophe/strophe.min.js"></script>
                <script src="scripts/strophe/strophe.pubsub.min.js"></script>
                <script src="scripts/old/interfaceAccess.js"></script>
                <script src="scripts/old/stropheAccess.js"></script>
                <script src="scripts/old/stropheSession.js"></script>
                <script src="scripts/old/sessionAccess.js"></script>
                <script src="scripts/old/dataAccess.js"></script>
                <script src="scripts/old/formValidation.js"></script>
                <script src="scripts/old/master.js"></script>
                <script src="scripts/moment.js"></script>
                <script src="scripts/old/setManager.js"></script>
		<script src="js/password.js"></script>
	</head>
	<body id="body">
		<div class="container">
			<div class="row">
				<div class="col s12 center">
					<h4>تغيير كلمة مرور مدير إخطار</h4>
				</div>
				<div class="col s12 l6 pull-l6">
					<img src="imgs/node_graph.png">
				</div>
				<div class="col s12 l6 push-l6">
					<div class="login-box content-block">
						<div class="content-header center">
							<i class="material-icons">lock</i>
						</div>
						<div>
							<div class="input-field">
								<i class="material-icons prefix">lock_open</i>
								<input id="oldPasswordText" type="password" class="validate">
								<label for="oldPasswordText">كلمة المرور الحالية</label>
							</div>
							<div>
								<div class="input-field">
								<i class="material-icons prefix">vpn_key</i>
								<input id="passwordText" type="password" class="validate">
								<label for="passwordText">كلمة المرور الجديدة</label>
							</div>
							<div>
								<div class="input-field">
								<i class="material-icons prefix">vpn_key</i>
								<input id="confirmPasswordText" type="password" class="validate">
								<label for="confirmPasswordText">تأكيد كلمة المرور الجديدة</label>
							</div>
							<label id='resultLabel'>&nbsp; </label>
							<button id="changePasswordButton" class="btn waves-effect waves-light" style="width: 100%">تغيير كلمة المرور</button>
						</div>
					</div>	
				</div>
			</div>
		</div>
	</body>
</html>
